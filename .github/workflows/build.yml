name: Build ArcanumCraft

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -B

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArcanumCraft-jar
          path: target/ArcanumCraft.jar
          if-no-files-found: error

      - name: Upload source zip
        if: success()
        run: |
          cd ..
          zip -r ArcanumCraft-source.zip ArcanumCraft \
            -x "ArcanumCraft/build/*" \
            -x "ArcanumCraft/.git/*" \
            -x "ArcanumCraft/.gradle/*" \
            -x "ArcanumCraft/target/*"
          mv ArcanumCraft-source.zip ArcanumCraft/
        working-directory: .

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArcanumCraft-source
          path: ArcanumCraft/ArcanumCraft-source.zip
          if-no-files-found: warn

      - name: Create Release
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          files: target/ArcanumCraft.jar
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
