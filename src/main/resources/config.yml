# ArcanumCraft 主配置文件
# 所有数值可通过配置文件调整，重启或 /arcanumcraft reload 生效

# ===== 魔晶系统 =====
crystal:
  # 自然生成矿脉配置
  ore-generation:
    enabled: true
    # 每个区块最大生成数量
    max-per-chunk: 3
    # 最大生成高度 (Y轴)
    max-height: 40
    # 最小生成高度
    min-height: 10
  # 魔晶购买力（每个魔晶可购买的价值）
  crystal-value: 1.0
  # 玩家间转账最小金额
  min-transfer: 1
  # 每日获取上限
  daily-limit: 100
  # 加入服务器奖励
  join-bonus: 10
  # 死亡保留比例（0-1，1=全部保留）
  keep-on-death: 1.0

# ===== 传送门系统 =====
portal:
  # 建立传送门所需魔晶费用
  cost: 50
  # 同名传送门是否允许（false=强制唯一）
  allow-duplicate-names: false
  # 传送延迟（秒），0=瞬间
  teleport-delay: 0
  # 传送后给予短暂保护（秒），防止被攻击
  protection-seconds: 2
  # 远程传送门所在区块是否强制加载
  force-chunk-load: true
  # 传送冷却时间（秒）
  cooldown-seconds: 30

# ===== 熔炉系统 =====
forge:
  # 各熔炉建立费用（魔晶数量）
  costs:
    smelting-furnace: 30
    smoker: 40
    blast-furnace: 50
    cauldron: 20
  # 自动工作间隔（秒）
  work-interval: 5
  # 单个熔炉最大同时处理物品数
  max-stack: 64
  # 熔炉耐久（破坏后可回收部分魔晶）
  durability:
    smelting-furnace: 100
    smoker: 120
    blast-furnace: 150
    cauldron: 80
  # 加速卡配置
  boost-cards:
    enabled: true
    # 加速卡效果：减少工作间隔百分比
    speed-boost-percent: 50
    # 加速卡持续时间（秒）
    duration-seconds: 300

# ===== 附魔系统 =====
enchantment:
  # 祭坛附魔费用倍率（基准为普通附魔台）
  cost-multiplier: 2.0
  # 最大可附魔等级
  max-level: 10
  # 自定义附魔启用列表
  custom-enchantments:
    - soul-fire
    - void-touch
    - arcane-mastery
    - temporal-shift
    - elemental-resonance
  # 附魔书掉落率
  book-drop-chance: 0.15

# ===== 元素系统 =====
element:
  # 元素转化配置
  conversion:
    enabled: true
    # 元素水晶制作配方（需要4个对应元素碎片 + 1个空水晶）
    shard-cost: 4
    # 元素水晶价值（魔晶）
    crystal-value:
      fire: 10
      water: 10
      earth: 10
      air: 10
      arcane: 25
  # 元素抗性列表
  resistances:
    fire-resistance:
      name: "火焰抗性"
      damage-reduction: 0.5
      duration-seconds: 30
      cost-crystals: 5
      particles: "flame"
    water-resistance:
      name: "水流抗性"
      damage-reduction: 0.3
      duration-seconds: 30
      cost-crystals: 5
      particles: "bubble"
    earth-resistance:
      name: "大地抗性"
      damage-reduction: 0.4
      duration-seconds: 30
      cost-crystals: 5
      particles: "block_crack"
    air-resistance:
      name: "气流抗性"
      speed-boost: true
      speed-amplifier: 1
      duration-seconds: 30
      cost-crystals: 5
      particles: "wind"

# ===== 任务系统 =====
quest:
  # 任务生成配置
  generation:
    enabled: true
    max-active-quests: 5
    # 任务奖励倍率
    reward-multiplier: 1.5
    # 任务刷新间隔（天）
    refresh-interval-days: 1
  # 预设任务
  quests:
    lumberjack:
      name: "伐木工"
      description: "砍伐100棵橡树木"
      type: BLOCK_BREAK
      target-block: OAK_LOG
      target-count: 100
      rewards:
        crystals: 20
        experience: 500
        items:
          - material: OAK_LOG
            amount: 10
    miner:
      name: "矿工"
      description: "挖掘50个铁矿石"
      type: BLOCK_BREAK
      target-block: IRON_ORE
      target-count: 50
      rewards:
        crystals: 30
        experience: 800
        items:
          - material: IRON_INGOT
            amount: 5
    builder:
      name: "建筑师"
      description: "放置200个方块"
      type: BLOCK_PLACE
      target-count: 200
      rewards:
        crystals: 15
        experience: 300
    slayer:
      name: "怪物猎人"
      description: "击杀20个怪物"
      type: ENTITY_KILL
      target-count: 20
      rewards:
        crystals: 25
        experience: 600
        items:
          - material: ROTTEN_FLESH
            amount: 10
    fisherman:
      name: "钓鱼高手"
      description: "钓到10条鱼"
      type: FISH
      target-count: 10
      rewards:
        crystals: 10
        experience: 200

# ===== 成就系统 =====
achievement:
  # 成就解锁时给予的魔晶奖励
  crystal-reward: 50
  # 成就解锁音效
  unlock-sound: "ENTITY_PLAYER_LEVELUP"
  achievements:
    first-portal:
      name: "空间行者"
      description: "创建第一个传送门"
      requirement: "create_portal"
      requirement-value: 1
    first-forge:
      name: "工匠学徒"
      description: "建立第一个熔炉"
      requirement: "build_forge"
      requirement-value: 1
    crystal-rich:
      name: "富有之人"
      description: "拥有1000魔晶"
      requirement: "own_crystals"
      requirement-value: 1000
    master-enchanter:
      name: "附魔大师"
      description: "使用10次自定义附魔"
      requirement: "use_enchant"
      requirement-value: 10
    explorer:
      name: "探索者"
      description: "传送到10个不同的传送门"
      requirement: "use_portal"
      requirement-value: 10
    forge-master:
      name: "熔炉大师"
      description: "建立5个熔炉"
      requirement: "build_forge"
      requirement-value: 5
    element-adept:
      name: "元素精通"
      description: "合成5个元素水晶"
      requirement: "craft_element"
      requirement-value: 5
    quest-complete:
      name: "任务达人"
      description: "完成10个任务"
      requirement: "complete_quest"
      requirement-value: 10
    legendary:
      name: "传奇冒险家"
      description: "解锁所有基础成就"
      requirement: "unlock_achievements"
      requirement-value: 8

# ===== 杂项 =====
messages:
  language: zh_cn
  prefix: "&9[魔导工匠] &f"
  # 启用音效反馈
  enable-sound-feedback: true
  # 启用粒子效果
  enable-particle-effects: true
  # 启用进度更新提示
  enable-progress-updates: true
  # 进度提示冷却（秒）
  progress-update-cooldown: 60
